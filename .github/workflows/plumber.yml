# Managed by the Plumber platform: onboarding wrote this file and unboarding deletes it.
name: Plumber
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@6194d20b44fde47bde7ba058156c5964b3a33459 # v0.7.22
        with:
          platform: https://thibaud.r2devops.tech
