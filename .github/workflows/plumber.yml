# Managed by the Plumber platform: onboarding wrote this file and unboarding deletes it.
name: Plumber
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@4804289c25a4417f689d8fdc6622a293bb47fc0e # v0.6.1
        with:
          platform: https://thibaud.r2devops.tech
